name: Godot syntax check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
      - name: Import game
        run: godot --headless --editor --path . --quit
      - name: Run smoke test
        run: godot --headless --path . --quit-after 60
